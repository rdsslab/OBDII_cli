; obd-esp32-elm327 — ESP32 as Wi-Fi access point + web server, talking to
; the ELM327 over Bluetooth Classic (SPP). See README.md.
;
; Board: classic ESP32 only (ESP32-WROOM-32 / WROVER: DevKit V1, DevKitC V4,
; ESP32-CAM). ESP32-S2/S3/C3/C6 have no Bluetooth Classic and cannot talk to
; an SPP ELM327.

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Arduino-ESP32 2.0.17 (BluetoothSerial with master mode + discover())
platform = espressif32@6.9.0
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Bluetooth Classic + Wi-Fi + web server do not fit the default 1.25 MB app
; partition: huge_app gives ~3.15 MB app space (no OTA). Use min_spiffs.csv if OTA is needed.
board_build.partitions = huge_app.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
lib_deps =
    esp32async/AsyncTCP@^3.3.2
    esp32async/ESPAsyncWebServer@^3.7.0
    bblanchon/ArduinoJson@^7.2.0
; web/*.html -> include/web_assets.h (gzip, PROGMEM)
extra_scripts = pre:scripts/embed_web.py

; Unit tests of the pure logic (lib/obd_text, lib/auth_core) on the PC:
;   pio test -e native        (needs a host C++ compiler: gcc/MinGW or clang)
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
