<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>OBD2 ESP32 · Ingreso</title>
<style>
:root{--bg:#f4f6f8;--surface:#fff;--text:#14202b;--muted:#5d6b78;--border:#dde3e9;--accent:#0b7bc0;--bad:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--surface:#17212c;--text:#e6edf3;--muted:#93a1ae;--border:#2a3744;--accent:#3aa0e6;--bad:#ef5350}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px}
h1{font-size:1.25rem;margin:0 0 4px}p{color:var(--muted);margin:0 0 20px;font-size:.9rem}
label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);margin-bottom:14px}
input{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
button{width:100%;font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.5}.error{color:var(--bad);font-size:.9rem;min-height:1.4em;margin:10px 0 0}
</style>
</head>
<body>
<form id="f">
  <h1>OBD2 · ESP32</h1>
  <p>Ingresa para ver el panel del vehículo.</p>
  <label>Usuario<input id="user" name="user" autocomplete="username" required autofocus></label>
  <label>Clave<input id="pass" name="pass" type="password" autocomplete="current-password" required></label>
  <button id="go">Ingresar</button>
  <div id="err" class="error" role="alert"></div>
</form>
<script>
const f = document.getElementById('f');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', body: new URLSearchParams(new FormData(f)) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { location.href = '/'; return; }
    err.textContent = d.error || ('Error ' + r.status);
  } catch (x) { err.textContent = 'Sin conexión con el ESP32'; }
  btn.disabled = false;
});
</script>
</body>
</html>
