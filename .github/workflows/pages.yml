# Builds the PWA (apps/pwa) and publishes it on GitHub Pages.
# The build itself has no dependencies (it only copies files); npm ci is
# only needed to run the tests.
name: Publish PWA

on:
  push:
    branches: [main]
    paths:
      - 'apps/pwa/**'
      - 'packages/core/src/**'
      - 'packages/ui/**'
      - 'packages/web-serial/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test core and UI
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Build PWA
        run: node apps/pwa/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/pwa/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
